name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: reposhild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://reposhild:reposhild@localhost:5432/reposhild?schema=public
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/reposhild:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/reposhild:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reposhild:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reposhild:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare the app directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: mkdir -p /root/reposhild

      - name: Copy the Compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: docker-compose.yml
          target: /root/reposhild
          overwrite: true

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -eu
            cd /root/reposhild
            if [ ! -f .env ]; then
              echo "Create /root/reposhild/.env from .env.example before the first deploy." >&2
              exit 1
            fi
            # Compose interpolation reads the shell, and an empty exported name hides the .env value.
            while IFS= read -r line || [ -n "$line" ]; do
              line=${line%$'\r'}
              case "$line" in
                ''|\#*) continue ;;
              esac
              key=${line%%=*}
              value=${line#*=}
              case "$value" in
                \"*\") value=${value#\"}; value=${value%\"} ;;
                \'*\') value=${value#\'}; value=${value%\'} ;;
              esac
              export "$key=$value"
            done < .env
            if [ -z "${POSTGRES_PASSWORD:-}" ]; then
              POSTGRES_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)
              grep -v '^POSTGRES_PASSWORD=' .env > .env.next || true
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> .env.next
              mv .env.next .env
              chmod 600 .env
              export POSTGRES_PASSWORD
              echo "POSTGRES_PASSWORD was missing. A password was saved in /root/reposhild/.env and is not printed here."
            fi
            export POSTGRES_USER="${POSTGRES_USER:-reposhild}"
            export POSTGRES_DB="${POSTGRES_DB:-reposhild}"
            for key in AUTH_SECRET AUTH_GITHUB_ID AUTH_GITHUB_SECRET AUTH_URL; do
              eval "value=\${$key-}"
              if [ -z "$value" ]; then
                echo "Missing $key in /root/reposhild/.env" >&2
                exit 1
              fi
            done
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            export REPOSHILD_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/reposhild:${{ github.sha }}
            docker compose pull app
            docker compose up -d --wait --wait-timeout 180
            docker logout
            docker image prune -f
